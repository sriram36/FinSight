services:
  - type: web
    name: finsight-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "https://finsight-wine-tau.vercel.app,http://localhost:3000"
      - key: DATABASE_URL
        value: ""
